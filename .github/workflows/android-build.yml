# GitHub Actions: 클라우드에서 안드로이드 앱 빌드 (내 PC에 안드로이드 개발도구 없이)
# 위치: .github/workflows/android-build.yml (원본 템플릿: projects/magic-gostop/app/ci/android-build.yml)
#  - 매번: 테스트용 APK(서명 없는 디버그)를 만들어 Actions 결과물로 올린다.
#  - 저장소 Secrets에 업로드 키가 있으면: Play Console에 올릴 서명된 AAB도 만든다.
#    필요한 Secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
name: android-build
on:
  workflow_dispatch:
  push:
    branches: [project/magic-gostop]
    paths: ['projects/magic-gostop/**']
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}  # step의 if에서는 secrets를 직접 못 써서 여기서 판정
    defaults: { run: { working-directory: projects/magic-gostop } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: 웹 결과물 만들기
        run: cd game && npm ci && npm run build:app
      - name: Capacitor 동기화
        run: cd app && npm ci && npx cap sync android
      - name: 디버그 APK
        run: cd app/android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: magic-gostop-debug-apk, path: projects/magic-gostop/app/android/app/build/outputs/apk/debug/*.apk }
      - name: 서명된 AAB (업로드 키가 있을 때만)
        if: env.HAS_KEY == 'true'
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > app/android/upload.jks
          cd app/android && ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=$PWD/upload.jks \
            -Pandroid.injected.signing.store.password="$KS_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"
      - uses: actions/upload-artifact@v4
        if: env.HAS_KEY == 'true'
        with: { name: magic-gostop-release-aab, path: projects/magic-gostop/app/android/app/build/outputs/bundle/release/*.aab }
